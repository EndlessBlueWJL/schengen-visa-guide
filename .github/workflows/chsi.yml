name: CHSI integration and privacy
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-chsi.txt
      - run: python -m unittest discover -s tests -v
      - run: python scripts/check_public_files.py --worktree
      - run: python scripts/check_public_history.py --revision HEAD
